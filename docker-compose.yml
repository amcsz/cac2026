services:
  db:
    image: postgres:16-alpine
    container_name: cac2026-db
    environment:
      POSTGRES_DB: cac2026
      POSTGRES_USER: cac2026
      POSTGRES_PASSWORD: cac2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cac2026 -d cac2026"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "15432:5432"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: cac2026-backend
    environment:
      DJANGO_SECRET_KEY: dev-only-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: cac2026
      POSTGRES_USER: cac2026
      POSTGRES_PASSWORD: cac2026
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-15432}
      WAIT_FOR_POSTGRES: "1"
      SEED_INITIAL_DATA: "1"
      CORS_ALLOW_ALL_ORIGINS: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_CONNECT_TIMEOUT_SECONDS: ${GEMINI_CONNECT_TIMEOUT_SECONDS:-2}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-1000}
      GUNICORN_TIMEOUT_SECONDS: ${GUNICORN_TIMEOUT_SECONDS:-180}
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-}
    container_name: cac2026-frontend
    ports:
      - "0.0.0.0:8081:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
