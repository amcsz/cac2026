<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="CAC 2026 Flutter app">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAC 2026</title>
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <script>
      (function () {
        var cacheClearedKey = 'cac2026-service-worker-cleared';

        function loadFlutter() {
          var script = document.createElement('script');
          script.src = 'flutter_bootstrap.js';
          script.async = true;
          document.body.appendChild(script);
        }

        if (!('serviceWorker' in navigator) || sessionStorage.getItem(cacheClearedKey)) {
          loadFlutter();
          return;
        }

        sessionStorage.setItem(cacheClearedKey, '1');
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .then(function () {
            if (!window.caches) {
              return Promise.resolve();
            }
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) {
                return caches.delete(key);
              }));
            });
          })
          .finally(function () {
            if (navigator.serviceWorker.controller) {
              window.location.reload();
              return;
            }
            loadFlutter();
          });
      })();
    </script>
  </body>
</html>
